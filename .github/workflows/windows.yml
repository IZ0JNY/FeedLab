name: FeedLab per Windows e Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install
        run: python -m pip install -r requirements-desktop.txt pytest
      - name: Tests (incl. app smoke test and fake-openEMS background jobs)
        run: python -m pytest -q -ra
      - name: Screenshots of the app
        continue-on-error: true
        run: |
          python -m pip install playwright
          python tests/ui_screens.py screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/
          if-no-files-found: ignore

  build:
    name: Build installer
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: App script runs in the packaged Python
        shell: pwsh
        working-directory: build/FeedLab/app
        run: |
          ..\python\python.exe -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('feedlab_main.py', default_timeout=600); at.run(); errs = [e.value for e in at.exception]; print('eccezioni:', errs); raise SystemExit(1 if errs else 0)"
      - name: Silent install + server smoke test + screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\FeedLab-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\FeedLab"
          if (-not (Test-Path "$app\python\pythonw.exe")) { throw "installazione non trovata" }
          if (Test-Path "$app\python\FeedLab.exe") { throw "FeedLab.exe (pythonw modificato) non deve più esserci" }
          foreach ($exe in "python.exe", "pythonw.exe") {      # interpreters must keep the PSF signature
            $sig = Get-AuthenticodeSignature "$app\python\$exe"
            Write-Host "$exe : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$exe senza firma digitale valida" }
          }
          $p = Start-Process "$app\python\python.exe" -ArgumentList "-m","feedlab.desktop","--server-only","--port","8765" -WorkingDirectory "$app\app" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8765/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { Get-Content "$env:APPDATA\FeedLab\server.log" -Tail 50; throw "il server non risponde" }
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edge) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=45000 --screenshot="$PWD\dist\screenshot.png" http://127.0.0.1:8765
            Start-Sleep 5
          }
          & "$app\python\python.exe" -m feedlab.openems_local status
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: FeedLab-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/FeedLab-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/screenshot.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FeedLab-Windows-portable-${{ steps.ver.outputs.version }}
          path: dist/FeedLab-*-portable.zip
          retention-days: 30

  linux:
    name: Build Linux (.deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgirepository1.0-dev libcairo2-dev pkg-config xz-utils
          python -m pip install uv
      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: linux/build.sh --version ${{ steps.ver.outputs.version }}
      - name: Tests with the packaged Python
        run: |
          py=build/linux/root/opt/feedlab/python/bin/python3
          uv pip install --python $py --target build/pytest pytest
          PYTHONNOUSERSITE=1 PYTHONPATH=build/pytest $py -m pytest -q -ra -p no:cacheprovider
      - name: Install the .deb + server smoke test
        run: |
          sudo apt-get install -y -q ./dist/feedlab_*_amd64.deb
          test -x /usr/bin/feedlab && test -f /usr/share/applications/feedlab.desktop
          feedlab --selftest
          feedlab --server-only --port 8765 &
          for i in $(seq 90); do
            if [ "$(curl -s http://127.0.0.1:8765/_stcore/health)" = "ok" ]; then ok=1; break; fi
            sleep 2
          done
          [ -n "${ok:-}" ] || { tail -50 ~/.config/FeedLab/server.log; exit 1; }
          pkill -f "streamlit run" || true
      - name: AppImage smoke test
        run: |
          app=$(ls dist/FeedLab-*-x86_64.AppImage)
          chmod +x "$app"
          export APPIMAGE_EXTRACT_AND_RUN=1          # the runner has no FUSE
          "$app" --selftest
          "$app" --server-only --port 8766 &
          ok=
          for i in $(seq 90); do
            if [ "$(curl -s http://127.0.0.1:8766/_stcore/health)" = "ok" ]; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { tail -50 ~/.config/FeedLab/server.log; exit 1; }
          pkill -f "streamlit run" || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: FeedLab-Linux-${{ steps.ver.outputs.version }}
          path: |
            dist/feedlab_*_amd64.deb
            dist/FeedLab-*-x86_64.AppImage
            dist/SHA256SUMS-linux.txt
          retention-days: 30
          compression-level: 0

  release:
    name: GitHub release (Windows + Linux)
    needs: [build, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: FeedLab-*
          merge-multiple: true
      - name: Publish (new version) or add what is missing (version already published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}; fi
          tag="v$v"
          cd dist
          ls -la
          files=(FeedLab-Setup-*.exe FeedLab-*-portable.zip feedlab_*_amd64.deb FeedLab-*-x86_64.AppImage)
          if gh release view "$tag" > /dev/null 2>&1; then
            # never overwrite published files: only add the ones the release does not have yet
            # (e.g. the Linux packages of a version first published for Windows only)
            have=$(gh release view "$tag" --json assets --jq '.assets[].name')
            add=()
            for f in "${files[@]}" SHA256SUMS-linux.txt; do
              grep -qxF "$f" <<< "$have" || add+=("$f")
            done
            if [ ${#add[@]} -eq 0 ]; then
              echo "$tag already published with all its files: not overwritten (bump the version to publish changes)"
            else
              echo "adding to $tag: ${add[*]}"
              gh release upload "$tag" "${add[@]}"
            fi
          else
            cat SHA256SUMS.txt SHA256SUMS-linux.txt > SHA256SUMS-all.txt
            mv SHA256SUMS-all.txt SHA256SUMS.txt
            gh release create "$tag" "${files[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" --latest \
              --title "FeedLab $tag per Windows e Linux" --notes-file ../windows/RELEASE_NOTES.md
          fi
